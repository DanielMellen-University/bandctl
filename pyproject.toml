[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bandctl"
description = "Terminal UI for per-process bandwidth shares on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Mellen" }]
keywords = ["bandwidth", "traffic-shaping", "tc", "htb", "nftables", "cgroups", "tui", "textual"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = ["textual==8.2.8"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/DanielMellen-University/bandctl"
Documentation = "https://github.com/DanielMellen-University/bandctl/tree/main/docs"
Changelog = "https://github.com/DanielMellen-University/bandctl/blob/main/CHANGELOG.md"

[project.scripts]
bandctl = "bandctl.__main__:main"

[tool.setuptools]
packages = ["bandctl"]

[tool.setuptools.dynamic]
version = { attr = "bandctl.__version__" }

[tool.setuptools.package-data]
bandctl = ["*.tcss"]
